name: Deploy production

on:
  # Автодеплой начинается только после успешного полного CI на main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Два деплоя не должны одновременно пересобирать одни и те же контейнеры.
  group: production-deploy
  cancel-in-progress: false

env:
  # Несекретные значения можно переопределить в Settings → Secrets and
  # variables → Actions → Variables. Значения ниже уже подходят этой VPS.
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/root/massage_parlors_crm' }}
  DEPLOY_BRANCH: main
  PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || 'https://trexon-a.ru' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ghcr.io/antongo22/massage-parlors-crm
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy и уведомление
    runs-on: ubuntu-latest
    # Даже если VPS принимает TCP-соединение, но завис до SSH-handshake,
    # workflow не должен занимать runner полтора часа.
    timeout-minutes: 45
    environment: production

    steps:
      - name: Получить проверенный CI коммит
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Подготовить production env
        id: prepare_env
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          if [[ -z "$SSH_HOST" || -z "$SSH_USERNAME" ]]; then
            echo "::error::Добавьте SSH_HOST и SSH_USERNAME в Actions Secrets"
            exit 1
          fi

          if [[ -z "$PRODUCTION_ENV" ]]; then
            echo "::error::Добавьте secret PRODUCTION_ENV в GitHub Environment production"
            exit 1
          fi

          production_env_b64="$(printf '%s' "$PRODUCTION_ENV" | base64 -w 0)"
          echo "::add-mask::$production_env_b64"
          echo "PRODUCTION_ENV_B64=$production_env_b64" >> "$GITHUB_ENV"

      - name: Проверить доступность SSH
        id: ssh_preflight
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        timeout-minutes: 3
        run: |
          for attempt in {1..6}; do
            if ssh_key="$(ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null)" && [[ -n "$ssh_key" ]]; then
              echo "SSH отвечает (попытка $attempt/6)"
              exit 0
            fi

            if [[ "$attempt" -lt 6 ]]; then
              echo "SSH пока не отвечает (попытка $attempt/6), повтор через 10 секунд"
              sleep 10
            fi
          done

          echo "::error::VPS принимает TCP-соединение, но не завершает SSH-handshake. Проверьте нагрузку и sshd либо перезагрузите VPS."
          exit 1

      - name: Войти в GitHub Container Registry
        id: registry_login
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Подготовить Docker Buildx
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Собрать и опубликовать приложение
        id: build_app
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app

      - name: Собрать и опубликовать образ миграций
        id: build_migration
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migration
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-migration:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-app

      - name: Собрать и опубликовать воркер
        id: build_worker
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-app

      - name: Обновить приложение по SSH
        id: ssh_deploy
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        timeout-minutes: 25
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          PRODUCTION_ENV_B64: ${{ env.PRODUCTION_ENV_B64 }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          port: ${{ env.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30m
          envs: DEPLOY_PATH,DEPLOY_BRANCH,DEPLOY_SHA,IMAGE_PREFIX,PRODUCTION_ENV_B64,REGISTRY_USERNAME,REGISTRY_TOKEN
          script: |
            set -eu

            # Bootstrap-очистка выполняется до git fetch. Она нужна, когда
            # Docker занял диск целиком и Git уже не может обновить deploy.sh.
            if docker info >/dev/null 2>&1; then
              docker_root="$(docker info --format '{{.DockerRootDir}}')"
              free_mb="$(df -Pm "$docker_root" | awk 'NR == 2 { print $4 }')"

              if [ "$free_mb" -lt 2048 ]; then
                echo "На диске свободно ${free_mb} МБ — освобождаем Docker build-cache до git fetch"
                docker builder prune --all --force >/dev/null || true
                docker image prune --force >/dev/null || true

                # Удаляем только старые неиспользуемые образы этой CRM.
                # Volumes PostgreSQL/Redis и образы других приложений не трогаем.
                docker image ls --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r image_ref; do
                  case "$image_ref" in
                    "${IMAGE_PREFIX}-app:"*|"${IMAGE_PREFIX}-migration:"*|"${IMAGE_PREFIX}-worker:"*)
                      docker image rm "$image_ref" >/dev/null 2>&1 || true
                      ;;
                  esac
                done

                free_mb="$(df -Pm "$docker_root" | awk 'NR == 2 { print $4 }')"
                echo "После bootstrap-очистки свободно ${free_mb} МБ"
              fi
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Репозиторий не найден: $DEPLOY_PATH" >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git merge --ff-only "origin/$DEPLOY_BRANCH"

            # Секрет передаётся как base64, чтобы переносы строк и спецсимволы
            # не повредились при передаче через SSH.
            umask 077
            printf '%s' "$PRODUCTION_ENV_B64" | base64 --decode > .env.production.tmp
            printf '\nIMAGE_PREFIX=%s\nIMAGE_TAG=%s\nPREBUILT_IMAGES=true\n' \
              "$IMAGE_PREFIX" "$DEPLOY_SHA" >> .env.production.tmp
            mv .env.production.tmp .env.production
            chmod 600 .env.production

            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
              --username "$REGISTRY_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            ./deploy.sh

      - name: Проверить приложение извне
        id: healthcheck
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            "${PUBLIC_URL%/}/login" > /dev/null

      - name: Отправить результат в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PREPARE_OUTCOME: ${{ steps.prepare_env.outcome }}
          SSH_PREFLIGHT_OUTCOME: ${{ steps.ssh_preflight.outcome }}
          BUILD_APP_OUTCOME: ${{ steps.build_app.outcome }}
          BUILD_MIGRATION_OUTCOME: ${{ steps.build_migration.outcome }}
          BUILD_WORKER_OUTCOME: ${{ steps.build_worker.outcome }}
          DEPLOY_OUTCOME: ${{ steps.ssh_deploy.outcome }}
          HEALTHCHECK_OUTCOME: ${{ steps.healthcheck.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Добавьте TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в Environment production"
            exit 1
          fi

          short_sha="${COMMIT_SHA:0:7}"

          if [[ "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}" != "true" ]]; then
            title="❌ CI не пройден — деплой отменён"
            details="Статус CI: ${CI_CONCLUSION:-unknown}"
          elif [[ "$PREPARE_OUTCOME" == "success" && "$BUILD_APP_OUTCOME" == "success" && "$BUILD_MIGRATION_OUTCOME" == "success" && "$BUILD_WORKER_OUTCOME" == "success" && "$DEPLOY_OUTCOME" == "success" && "$HEALTHCHECK_OUTCOME" == "success" ]]; then
            title="✅ Деплой успешен"
            details="Приложение: $PUBLIC_URL"
          else
            title="❌ Деплой завершился ошибкой"
            details="env: $PREPARE_OUTCOME, SSH preflight: $SSH_PREFLIGHT_OUTCOME, images: $BUILD_APP_OUTCOME/$BUILD_MIGRATION_OUTCOME/$BUILD_WORKER_OUTCOME, SSH deploy: $DEPLOY_OUTCOME, healthcheck: $HEALTHCHECK_OUTCOME"
          fi

          message="$title

          Репозиторий: ${{ github.repository }}
          Ветка: $DEPLOY_BRANCH
          Коммит: $short_sha
          Сервер: $SSH_USERNAME@$SSH_HOST:$SSH_PORT
          Запустил: $ACTOR
          $details

          Логи: $RUN_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null

      - name: Завершить workflow ошибкой, если CI не пройден
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: exit 1
