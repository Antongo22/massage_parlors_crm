server {
    listen 80;
    listen [::]:80;
    server_name mailpit.trexon-a.ru;

    # Certbot должен читать challenge без Basic Auth. Весь интерфейс Mailpit
    # остаётся закрыт даже во время первичного выпуска сертификата.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        auth_basic "Mailpit";
        auth_basic_user_file /etc/nginx/.htpasswd-mailpit;

        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
