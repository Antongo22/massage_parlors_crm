server {
    listen 80;
    listen [::]:80;
    server_name mailpit.trexon-a.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mailpit.trexon-a.ru;

    ssl_certificate /etc/letsencrypt/live/mailpit.trexon-a.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailpit.trexon-a.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Mailpit";
    auth_basic_user_file /etc/nginx/.htpasswd-mailpit;

    location / {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
